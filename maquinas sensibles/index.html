<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquinas sensibles | Rocio Mio</title>
    <meta name="description" content="Portal interactivo de Maquinas sensibles.">
    <link rel="stylesheet" href="../css/serie-i18n.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        :root {
            --ink: #111;
            --panel: rgba(250, 249, 244, 0.97);
            --hot: rgba(255, 255, 255, 0.08);
            --hot-on: rgba(255, 220, 80, 0.32);
        }

        html, body {
            height: 100%;
            background: #1a1a1a;
            color: var(--ink);
            overflow: hidden;
        }

        .maquina-chrome {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 3vw;
            pointer-events: none;
        }

        .maquina-chrome > * { pointer-events: auto; }

        .btn-volver {
            color: #fff;
            text-decoration: none;
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
        }

        .btn-volver:hover { opacity: 0.55; }

        .lang-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .maquina-pista {
            color: rgba(255, 255, 255, 0.78);
            font-size: 0.7rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
            max-width: 42vw;
            text-align: right;
        }

        /* Escenario - imagen completa contenida; hotspots relativos al marco */
        .board-stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
        }

        .board-frame {
            position: relative;
            width: min(100vw, calc(100vh * 1470 / 1070));
            height: min(100vh, calc(100vw * 1070 / 1470));
            flex-shrink: 0;
        }

        .board-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            user-select: none;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.45s ease;
            z-index: 0;
        }

        .board-bg.is-visible {
            opacity: 1;
            z-index: 1;
        }

        body.panel-abierto .board-frame::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.22);
            z-index: 2;
            pointer-events: none;
        }

        .hotspot {
            position: absolute;
            z-index: 5;
            border: 1.5px dashed rgba(0, 0, 0, 0.55);
            background: var(--hot);
            cursor: pointer;
            padding: 0;
            border-radius: 3px;
            transition: background 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        body.panel-abierto .hotspot:not(.activa) { opacity: 0.3; }

        .hotspot:hover,
        .hotspot:focus-visible,
        .hotspot.activa {
            background: var(--hot-on);
            box-shadow: 0 0 0 2px rgba(255, 220, 80, 0.55);
            outline: none;
            opacity: 1;
        }

        .hotspot-tag {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 6px);
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 0.62rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #111;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #111;
            padding: 3px 8px;
            opacity: 0;
            pointer-events: none;
        }

        .hotspot:hover .hotspot-tag,
        .hotspot:focus-visible .hotspot-tag,
        .hotspot.activa .hotspot-tag { opacity: 1; }

        /*
         * Zonas sobre Fig. 3.12 (marco = aspect de portada).
         * LCD inferior-centro · Teclado inferior-derecha.
         */
        .hotspot-lcd {
            left: 31%;
            top: 69%;
            width: 27%;
            height: 13%;
        }

        .hotspot-teclado {
            left: 69%;
            top: 66%;
            width: 20%;
            height: 25%;
        }

        .hotspot-cables {
            left: 40%;
            top: 14%;
            width: 30%;
            height: 24%;
            border-radius: 42% 18% 28% 48%;
        }

        .hotspot-puertos {
            left: 88%;
            top: 30%;
            width: 7%;
            height: 28%;
        }

        .hotspot-placa {
            left: 5%;
            top: 44%;
            width: 15%;
            height: 18%;
        }

        /* Paneles emergentes - izquierda o derecha segun zona */
        .maquina-panel {
            position: fixed;
            top: 0;
            width: min(560px, 46vw);
            height: 100vh;
            z-index: 50;
            background: var(--panel);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            transition: transform 0.35s ease;
        }

        .maquina-panel[data-side="left"] {
            left: 0;
            border-right: 1px solid #111;
            transform: translateX(0);
        }

        .maquina-panel[data-side="right"] {
            right: 0;
            left: auto;
            border-left: 1px solid #111;
            transform: translateX(0);
        }

        .maquina-panel[hidden] {
            display: flex !important;
            pointer-events: none;
        }

        .maquina-panel[hidden][data-side="left"] { transform: translateX(-105%); }
        .maquina-panel[hidden][data-side="right"] { transform: translateX(105%); }

        .panel-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 32px 36px 18px;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }

        .panel-label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 10px;
        }

        .panel-top h2 {
            font-size: clamp(2rem, 4vw, 3.4rem);
            font-weight: normal;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            line-height: 0.95;
            max-width: 11ch;
        }

        .panel-close {
            border: 1px solid #111;
            background: transparent;
            width: 42px;
            height: 42px;
            cursor: pointer;
            font-size: 1.3rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .panel-close:hover { background: #111; color: #fff; }

        .panel-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 24px 36px 48px;
        }

        .panel-texto {
            font-size: clamp(1rem, 1.3vw, 1.15rem);
            line-height: 1.55;
            color: #222;
            margin-bottom: 24px;
            max-width: 36ch;
        }

        .panel-media {
            display: grid;
            gap: 14px;
        }

        .media-frame {
            margin: 0;
            background: #111;
            line-height: 0;
            overflow: hidden;
        }

        .media-frame img,
        .media-frame video,
        .media-frame iframe {
            width: 100%;
            height: auto;
            display: block;
            border: 0;
        }

        .media-frame--video { aspect-ratio: 16 / 9; background: #000; }

        .media-frame--video video,
        .media-frame--video iframe {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .media-placeholder {
            min-height: 140px;
            border: 1px dashed #999;
            background: #eceae3;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 16px;
            font-size: 0.75rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #555;
        }

        .timeline-lista {
            list-style: none;
            border-left: 1px solid #111;
            margin-left: 8px;
            padding-left: 22px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .timeline-item { position: relative; }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: -27px;
            top: 7px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #111;
        }

        .timeline-fecha {
            display: block;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 4px;
        }

        .timeline-cuerpo strong {
            display: block;
            font-weight: normal;
            font-size: 1.15rem;
            margin-bottom: 4px;
        }

        .timeline-cuerpo p {
            font-size: 0.95rem;
            line-height: 1.45;
            color: #333;
        }

        body.panel-abierto .maquina-pista {
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 820px) {
            .maquina-pista { display: none; }
            .maquina-panel {
                width: 100vw;
                height: 58vh;
                top: auto;
                bottom: 0;
                left: 0 !important;
                right: 0 !important;
                border: none;
                border-top: 1px solid #111;
            }
            .maquina-panel[data-side="left"],
            .maquina-panel[data-side="right"] {
                transform: translateY(0);
            }
            .maquina-panel[hidden][data-side="left"],
            .maquina-panel[hidden][data-side="right"] {
                transform: translateY(105%);
            }
            .panel-top { padding: 20px 20px 12px; }
            .panel-top h2 { max-width: none; }
            .panel-body { padding: 18px 20px 36px; }
        }
    </style>
</head>
<body>

    <header class="maquina-chrome">
        <a href="../index.html#index" class="btn-volver" data-i18n="volver">[ VOLVER AL ORIGEN ]</a>
        <div class="lang-wrap">
            <p class="maquina-pista" id="maquinaPista">Tocá LCD o teclado para abrir cada bloque</p>
            <div class="serie-lang-toggle serie-lang-toggle--dark" role="group" aria-label="Idioma">
                <button type="button" data-lang-btn="es" aria-pressed="true">ES</button>
                <span class="serie-lang-sep">|</span>
                <button type="button" data-lang-btn="en" aria-pressed="false">EN</button>
            </div>
        </div>
    </header>

    <main class="board-stage" id="boardStage" aria-label="Placa Maquinas sensibles">
        <div class="board-frame" id="boardFrame">
            <img class="board-bg is-visible" id="boardBgA" src="memorias/portada.webp" alt="">
            <img class="board-bg" id="boardBgB" alt="" aria-hidden="true">

            <!-- LCD - captura enviada: "no me hubiera ido, quiza" · panel izquierdo -->
            <button type="button" class="hotspot hotspot-lcd" data-zona="idea" data-side="left" aria-label="LCD - idea">
                <span class="hotspot-tag">lcd · idea</span>
            </button>

            <!-- Teclado 4x4 - captura enviada · panel derecho -->
            <button type="button" class="hotspot hotspot-teclado" data-zona="uso" data-side="right" aria-label="Teclado - uso">
                <span class="hotspot-tag">teclado · uso</span>
            </button>

            <button type="button" class="hotspot hotspot-cables" data-zona="proceso" data-side="left" aria-label="Cables - proceso">
                <span class="hotspot-tag">cables · proceso</span>
            </button>

            <button type="button" class="hotspot hotspot-puertos" data-zona="curatorial" data-side="right" aria-label="Puertos - curatorial">
                <span class="hotspot-tag">puertos · curatorial</span>
            </button>

            <button type="button" class="hotspot hotspot-placa" data-zona="timeline" data-side="left" aria-label="Placa - linea de tiempo">
                <span class="hotspot-tag">placa · timeline</span>
            </button>
        </div>
    </main>

    <aside class="maquina-panel" id="maquinaPanel" data-side="left" hidden aria-hidden="true" aria-live="polite">
        <div class="panel-top">
            <div>
                <span class="panel-label" id="maquinaPanelLabel"></span>
                <h2 id="maquinaPanelTitle"></h2>
            </div>
            <button type="button" class="panel-close" id="maquinaPanelClose" aria-label="cerrar panel">×</button>
        </div>
        <div class="panel-body" id="maquinaPanelBody"></div>
    </aside>

    <script src="../js/maquinas-content.js"></script>
    <script src="../js/site-i18n.js"></script>
    <script src="../js/maquinas-page.js"></script>
</body>
</html>
